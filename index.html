<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6a3df0"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><title>על המצח! 🎉</title><link rel="stylesheet" href="style.css?v=3"></head><body>
<section id="home" class="screen active">
 <img class="logo" src="logo.png" alt="על המצח!" width="140" height="140"><h1>על המצח! <span>🎉</span></h1><p class="sub">משחק ניחושים משפחתי</p>
 <div class="card"><h3>מצב משחק</h3><div class="seg" id="modeSeg">
  <button data-v="pic" class="on">🖼️ תמונות<small>לקטנים</small></button><button data-v="word">🔤 מילים</button></div>
  <div id="diffBox"><h3>רמת קושי</h3><div class="seg" id="diffSeg"><button data-v="easy" class="on">קל</button><button data-v="medium">בינוני</button><button data-v="hard">קשה</button><button data-v="all">הכול</button></div></div>
  <label class="chk" id="labelBox"><input type="checkbox" id="showLabel" checked> להציג מילה מתחת לתמונה</label></div>
 <div class="card"><h3>זמן לסיבוב</h3><div class="seg" id="timeSeg"><button data-v="30">30 שנ'</button><button data-v="60" class="on">60 שנ'</button><button data-v="90">90 שנ'</button></div></div>
 <div class="card"><h3>קבוצות</h3><div class="seg" id="teamSeg"><button data-v="1" class="on">שחקן יחיד</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></div><div id="teamNames"></div>
  <div id="board"></div><button class="cta small" id="endGame">🏆 סיום משחק והכרזת מנצח</button><button class="link" id="resetScores">איפוס ניקוד</button></div>
 <h3 class="center">בחרו קטגוריה</h3><div id="cats" class="grid"></div>
 <label class="chk center"><input type="checkbox" id="invert"> הפוך כיוון הטיה</label>
 <p class="help">החזיקו את הטלפון לרוחב על המצח. הטו קדימה (מסך לרצפה) = ✅ נכון, הטו אחורה (מסך לתקרה) = ⏭️ דלג. אפשר גם ללחוץ על הכפתורים.</p>
</section>
<section id="ready" class="screen"><div id="readyTeam" class="big"></div><p>שימו את הטלפון על המצח ולחצו</p><button class="cta" id="go">מתחילים! ▶</button><button class="link" id="back1">חזרה</button></section>
<section id="count" class="screen"><div id="countNum" class="huge">3</div></section>
<section id="play" class="screen"><div id="timer">60</div><div id="scoreLive">0</div>
 <div id="item"><div id="emoji"></div><div id="word"></div></div>
 <button class="side skip" id="bSkip">⏭️<br>דלג</button><button class="side ok" id="bOk">✅<br>נכון</button>
 <div id="flash"></div><button id="quit">✕</button></section>
<section id="sum" class="screen"><h2 id="sumTitle"></h2><div id="sumScore" class="huge"></div><div id="sumSub"></div>
 <div class="lists"><div><h3>✅ ניחשו</h3><ul id="lOk"></ul></div><div><h3>⏭️ דילגו</h3><ul id="lSkip"></ul></div></div>
 <div id="board2"></div><div id="nextUp" class="big2"></div><button class="cta" id="next">התור הבא ▶</button><button class="cta small" id="endGame2">🏆 סיום משחק</button><button class="link" id="toHome">לתפריט</button></section>
<section id="win" class="screen"><div class="huge">🏆</div><h2 id="winTitle"></h2><ol id="winList"></ol><button class="cta" id="newGame">משחק חדש (איפוס) 🔄</button><button class="link" id="winHome">חזרה לתפריט בלי איפוס</button></section>
<script src="data.js?v=3"></script><script src="app.js?v=3"></script></body></html>
